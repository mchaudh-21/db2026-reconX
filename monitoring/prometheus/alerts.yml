groups:
  - name: reconx-business
    rules:
      - alert: TooManyReconBreaks
        expr: recon_break_count > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Open recon breaks > 50 for 5 min"
          description: "Current open-break count is {{ $value }}."

      - alert: HighApiLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, uri) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P95 request latency > 500ms on {{ $labels.uri }}"
          description: "Current P95 latency is {{ $value }} seconds."

      - alert: KafkaDlqGrowing
        expr: |
          increase(
            kafka_consumer_records_consumed_total{
              topic="trade-events-dlq"
            }[5m]
          ) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Messages landing in trade-events-dlq"
