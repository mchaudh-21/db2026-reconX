# =============================================================================
# TICKET-ADV049 — dev profile: H2 in PostgreSQL compatibility mode
# =============================================================================
spring:
  datasource:
    # INIT creates an H2 JSONB domain backed by H2's JSON type so the same
    # @Column(columnDefinition = "jsonb") mapping validates in dev.
    url: jdbc:h2:mem:reconx;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password:
    driver-class-name: org.h2.Driver
  liquibase:
    contexts: dev
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      missing-topics-fatal: false

logging:
  level:
    com.dbtraining.reconx: DEBUG
