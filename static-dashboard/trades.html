<!doctype html>
<!--
============================================================================
TICKET-ADV100 — Persistent light/dark theme
TICKET-ADV103 — Responsive layout
TICKET-ADV106 — Sortable, resizable trade table with sticky headers
============================================================================
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="description"
    content="View and sort ReconX trades"
  />

  <title>ReconX — Trades</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="layout">
    <header class="layout__header">
      <a
        class="brand"
        href="dashboard.html"
        aria-label="ReconX dashboard"
      >
        <span class="brand__mark" aria-hidden="true">RX</span>
        <span class="brand__name">ReconX</span>
      </a>

      <nav class="layout__nav" aria-label="Main navigation">
        <a
          class="layout__nav-link"
          href="dashboard.html"
        >
          Dashboard
        </a>

        <a
          class="layout__nav-link"
          href="trades.html"
          aria-current="page"
        >
          Trades
        </a>

        <a
          class="layout__nav-link"
          href="recon.html"
        >
          Reconciliation
        </a>
      </nav>

      <div class="layout__header-actions">
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark theme"
          aria-pressed="false"
        >
          <span
            id="theme-toggle-icon"
            class="theme-toggle__icon"
            aria-hidden="true"
          >
            ☾
          </span>

          <span class="theme-toggle__text">Theme</span>
        </button>
      </div>
    </header>

    <div class="layout__body">
      <aside
        class="layout__sidebar"
        aria-labelledby="quick-filters-heading"
      >
        <h2
          id="quick-filters-heading"
          class="layout__sidebar-title"
        >
          Quick filters
        </h2>

        <nav aria-label="Trade filters">
          <ul class="filter-list">
            <li class="filter-list__item">
              <a
                class="filter-list__link filter-list__link--active"
                href="trades.html"
              >
                All trades
              </a>
            </li>

            <li class="filter-list__item">
              <a
                class="filter-list__link"
                href="trades.html?status=BREAK"
              >
                Open breaks
              </a>
            </li>

            <li class="filter-list__item">
              <a
                class="filter-list__link"
                href="trades.html?period=today"
              >
                Today
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <main id="main-content" class="layout__main">
        <section
          class="dashboard-section fade-in"
          aria-labelledby="trades-heading"
        >
          <div class="section-heading">
            <div>
              <p class="section-heading__eyebrow">
                Trade management
              </p>

              <h1
                id="trades-heading"
                class="section-heading__title"
              >
                All trades
              </h1>
            </div>

            <a class="button-link" href="dashboard.html">
              Back to dashboard
            </a>
          </div>

          <div class="table-panel">
            <div class="table-toolbar">
              <p
                id="table-status"
                class="table-toolbar__status"
                role="status"
                aria-live="polite"
              >
                Loading trades…
              </p>

              <span class="section-heading__note">
                Select a heading to sort · Drag its edge to resize
              </span>
            </div>

            <div
              class="table-container"
              tabindex="0"
              aria-label="Scrollable trade table"
            >
              <table class="trade-table">
                <thead>
                  <tr>
                    <th scope="col" style="width: 13rem;">
                      <button
                        class="trade-table__sort"
                        type="button"
                        data-sort-key="tradeRef"
                        aria-sort="none"
                      >
                        Trade reference
                      </button>

                      <span
                        class="resize-handle"
                        role="separator"
                        aria-label="Resize trade reference column"
                        aria-orientation="vertical"
                        tabindex="0"
                      ></span>
                    </th>

                    <th scope="col" style="width: 10rem;">
                      <button
                        class="trade-table__sort"
                        type="button"
                        data-sort-key="instrumentSymbol"
                        aria-sort="none"
                      >
                        Instrument
                      </button>

                      <span
                        class="resize-handle"
                        role="separator"
                        aria-label="Resize instrument column"
                        aria-orientation="vertical"
                        tabindex="0"
                      ></span>
                    </th>

                    <th scope="col" style="width: 9rem;">
                      <button
                        class="trade-table__sort"
                        type="button"
                        data-sort-key="quantity"
                        aria-sort="none"
                      >
                        Quantity
                      </button>

                      <span
                        class="resize-handle"
                        role="separator"
                        aria-label="Resize quantity column"
                        aria-orientation="vertical"
                        tabindex="0"
                      ></span>
                    </th>

                    <th scope="col" style="width: 9rem;">
                      <button
                        class="trade-table__sort"
                        type="button"
                        data-sort-key="price"
                        aria-sort="none"
                      >
                        Price
                      </button>

                      <span
                        class="resize-handle"
                        role="separator"
                        aria-label="Resize price column"
                        aria-orientation="vertical"
                        tabindex="0"
                      ></span>
                    </th>

                    <th scope="col" style="width: 11rem;">
                      <button
                        class="trade-table__sort"
                        type="button"
                        data-sort-key="tradeDate"
                        aria-sort="none"
                      >
                        Trade date
                      </button>

                      <span
                        class="resize-handle"
                        role="separator"
                        aria-label="Resize trade date column"
                        aria-orientation="vertical"
                        tabindex="0"
                      ></span>
                    </th>

                    <th scope="col" style="width: 10rem;">
                      <button
                        class="trade-table__sort"
                        type="button"
                        data-sort-key="status"
                        aria-sort="none"
                      >
                        Status
                      </button>

                      <span
                        class="resize-handle"
                        role="separator"
                        aria-label="Resize status column"
                        aria-orientation="vertical"
                        tabindex="0"
                      ></span>
                    </th>
                  </tr>
                </thead>

                <tbody id="trade-table-body">
                  <tr>
                    <td colspan="6">
                      Loading trades…
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <footer class="layout__footer">
      <small>ReconX TDI 2026 · Static dashboard · Day 7</small>
    </footer>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/trades.js"></script>
</body>
</html>
